name: ecommerce
version: "1.0.0"
config-version: 2
profile: ecommerce
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages", "logs"]

flags:
  require_explicit_package_overrides_for_builtin_materializations: true
  send_anonymous_usage_stats: false

vars:
  # Order statuses that count as revenue in GOLD.
  revenue_order_statuses: ["paid", "shipped", "delivered"]
  # BRONZE schema monitored by the schema drift audit.
  drift_monitored_schema: BRONZE

models:
  ecommerce:
    +persist_docs:
      relation: true
      columns: true
    +query_tag: dbt-ecommerce
    silver:
      +schema: SILVER
      +materialized: view
      intermediate:
        # Views (not ephemeral) so they can be inputs of dbt unit tests.
        +materialized: view
    gold:
      +schema: GOLD
      +materialized: table
      +grants:
        select: ["ECOMMERCE_READER"]
    audit:
      +schema: AUDIT
      +tags: ["schema_audit"]

data_tests:
  ecommerce:
    # Failing rows are kept in AUDIT for investigation (one table per test).
    +store_failures: true
    +schema: AUDIT
