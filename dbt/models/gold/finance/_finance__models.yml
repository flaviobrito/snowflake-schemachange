version: 2

models:
  - name: agg_daily_revenue
    description: Daily revenue, margin and average order value by sales channel.
    config:
      contract: {enforced: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_date, order_channel]
    columns:
      - name: order_date
        data_type: date
        constraints: [{type: not_null}]
      - name: order_channel
        data_type: text
      - name: order_count
        data_type: number
      - name: customer_count
        data_type: number
      - name: unit_count
        data_type: number
      - name: revenue
        data_type: number
        data_tests: [non_negative]
      - name: gross_margin
        data_type: number
      - name: average_order_value
        data_type: number
