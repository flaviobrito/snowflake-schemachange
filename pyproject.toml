[project]
name = "snowflake-schemachange"
version = "1.0.0"
description = "Snowflake e-commerce lakehouse: schemachange for database migrations, dbt for medallion transformations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core==1.12.6",
    "dbt-snowflake==1.12.4",
    "schemachange==4.3.3",
]

[dependency-groups]
dev = [
    "faker==40.43.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
    "sqlfluff==4.4.0",
    "sqlfluff-templater-dbt==4.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/dbt_packages", "dbt/target", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:urllib3.*doesn.t match a supported version"]
